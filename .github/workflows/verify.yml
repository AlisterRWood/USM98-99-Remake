name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify agent handoff metadata
        run: ./tools/agent-check.sh --ci
      - name: Run authoritative verifier
        run: swift run -c release USMVerify
      - name: Build app for app/resource changes
        run: ./tools/build-app.sh
